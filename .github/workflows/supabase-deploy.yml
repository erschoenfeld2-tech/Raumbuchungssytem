name: Supabase Schema Deploy

# Wendet neue Datenbank-Migrationen (supabase/migrations/*.sql)
# automatisch auf das Supabase-Projekt an, sobald main aktualisiert wird.
#
# WICHTIG – manuelle Einrichtung nötig (siehe CICD_ANLEITUNG.md):
#   - Repo-Secrets SUPABASE_ACCESS_TOKEN und SUPABASE_DB_PASSWORD
#   - Empfohlen: GitHub Environment "production" anlegen (Settings →
#     Environments) und die beiden Secrets dort statt auf Repo-Ebene
#     hinterlegen, um Deployment-Regeln (z.B. Reviewer) zu ermöglichen.
#     Ohne angelegtes Environment läuft der Job trotzdem, nur ohne
#     zusätzlichen Schutz.

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch: {}

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/quality.yml

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Supabase CLI installieren
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Mit Supabase-Projekt verbinden
        run: supabase link --project-ref yugjccgblqsfjasienwa
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Migrationen anwenden
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
